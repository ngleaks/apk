# Where buildtools/build_apk.sh gets its tools. The install snippets fetch them from
# npmjs / pypi / github.com (the only hosts a locked-down sandbox may reach); a normal
# machine can just use the Android SDK + `gradle :app:assembleRelease` instead.
jdk            = jdk4py-17.0.9.2-*-py3-none-*.whl            (pypi: jdk4py==17.0.9.2)
platform       = minapk-0.5.1 tools/android.jar               (npm:  @drxiaozhi/minapk)
aapt2          = aaptjs3-2.0.2 bin/x64/linux/aapt2            (npm:  aaptjs3)
d8             = minapk-0.5.1 tools/d8.jar                    (npm:  @drxiaozhi/minapk)
apksigner      = minapk-0.5.1 tools/apksigner.jar             (npm:  @drxiaozhi/minapk)
ecj            = minapk-0.5.1 tools/ecj-3.45.0.jar            (npm:  @drxiaozhi/minapk)
kotlin-compiler= kotlin-compiler-2.4.21.tgz                   (npm:  kotlin-compiler — JetBrains build, JVM compiler inside lib/)

# Example setup (all paths git-ignored):
#   pip install --target=buildtools/pylibs jdk4py==17.0.9.2
#   npm install --prefix=buildtools/npm aaptjs3 @drxiaozhi/minapk
#   curl -L https://registry.npmjs.org/kotlin-compiler/-/kotlin-compiler-2.4.21.tgz | tar xz -C buildtools/
#   export JAVA_HOME=$PWD/buildtools/pylibs/jdk4py/java-runtime
#   export ANDROID_JAR=$PWD/buildtools/npm/node_modules/@drxiaozhi/minapk/tools/android.jar
#   export AAPT2=$PWD/buildtools/npm/node_modules/aaptjs3/bin/x64/linux/aapt2
#   export D8_JAR=$PWD/buildtools/npm/node_modules/@drxiaozhi/minapk/tools/d8.jar
#   export APKSIGNER_JAR=$PWD/buildtools/npm/node_modules/@drxiaozhi/minapk/tools/apksigner.jar
#   export ECJ_JAR=$PWD/buildtools/npm/node_modules/@drxiaozhi/minapk/tools/ecj-3.45.0.jar
#   export KOTLINC_HOME=$PWD/buildtools/package   # after extracting kotlin-compiler-2.4.21.tgz
