# Where buildtools/build_apk.sh gets its tools. The install script fetches these from
# npmjs + pypi (the only registries a locked-down sandbox may reach); GitHub Actions can use
# the same URLs, so both paths produce the identical APK.
jdk            = jdk4py-17.0.9.2-0-py3-none-manylinux1_x86_64.whl   (pypi: jdk4py==17.0.9.2)
platform       = minapk-0.5.1 tools/android.jar                     (npm:  @drxiaozhi/minapk)
aapt2          = aaptjs3-2.0.2 bin/x64/linux/aapt2                  (npm:  aaptjs3)
d8             = minapk-0.5.1 tools/d8.jar                          (npm:  @drxiaozhi/minapk)
apksigner      = minapk-0.5.1 tools/apksigner.jar                   (npm:  @drxiaozhi/minapk)
ecj (optional) = minapk-0.5.1 tools/ecj-3.45.0.jar                  (only if the JDK has no javac)
