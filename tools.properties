# Where buildtools/install_tools.sh gets its toolchain. Everything comes from the three registries a
# locked-down build host is usually allowed to reach (pypi + npm), so the offline pipeline in
# buildtools/build_apk.sh produces the same APK on a laptop, in CI and in a sandbox with no
# Android SDK, no Gradle and no Maven.
#
# key             package / artefact                                   registry
# --------------  --------------------------------------------------  --------------------------------
jdk               jdk4py==17.0.9.2 (JDK 17 Temurin, no javac)         pypi: jdk4py
android.jar       @drxiaozhi/minapk 0.5.1 -> tools/android.jar       npm:  @drxiaozhi/minapk
aapt2             aaptjs3 2.0.2 -> bin/x64/linux/aapt2               npm:  aaptjs3
d8                @drxiaozhi/minapk 0.5.1 -> tools/d8.jar           npm:  @drxiaozhi/minapk
apksigner         @drxiaozhi/minapk 0.5.1 -> tools/apksigner.jar    npm:  @drxiaozhi/minapk
ecj (optional)    @drxiaozhi/minapk 0.5.1 -> tools/ecj-3.45.0.jar   npm:  @drxiaozhi/minapk
                  (only used when the JDK ships without javac)
# android.jar ships API 36 stubs; the app declares targetSdk 35 so aapt2 accepts it unchanged.
android.jar api   generated with aapt2 link --target-sdk-version 35 in build_apk.sh
