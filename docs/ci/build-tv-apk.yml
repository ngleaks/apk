name: Build TV APK

on:
  push:
    branches: [main, "arena/**"]
    paths-ignore: ["**/*.md", "pbb-*.apk", "buildtools/dist/**"]
  pull_request:
  workflow_dispatch:

jobs:
  # Offline toolchain: downloads exactly the tools that "gradle assembleRelease" uses,
  # from npmjs and pypi, then runs aapt2 -> ecj -> kotlinc -> d8 -> apksigner.
  # Produces byte-compatible output with the local buildtools/build_apk.sh flow.
  offline-toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Fetch build tools
        run: |
          set -e
          cd "$RUNNER_TEMP"
          pip download --no-deps -q -d jdk jdk4py==17.0.9.2
          python3 -m zipfile -e jdk/*.whl jdkx
          curl -sL -o minapk.tgz https://registry.npmjs.org/@drxiaozhi/minapk/-/minapk-0.5.1.tgz
          mkdir -p minapk && tar xzf minapk.tgz -C minapk package/tools
          curl -sL -o aapt2.tgz https://registry.npmjs.org/aaptjs3/-/aaptjs3-2.0.2.tgz
          mkdir -p aapt2 && tar xzf aapt2.tgz -C aapt2 package/bin/x64/linux
          curl -sL -o kotlin.tgz https://registry.npmjs.org/kotlin-compiler/-/kotlin-compiler-2.4.21.tgz
          mkdir -p kotlin && tar xzf kotlin.tgz -C kotlin package
          chmod +x aapt2/package/bin/x64/linux/aapt2
          chmod -R +x jdkx/jdk4py/java-runtime/bin || true

      - name: Build APKs
        env:
          JAVA_HOME: ${{ runner.temp }}/jdkx/jdk4py/java-runtime
          ANDROID_JAR: ${{ runner.temp }}/minapk/package/tools/android.jar
          AAPT2: ${{ runner.temp }}/aapt2/package/bin/x64/linux/aapt2
          D8_JAR: ${{ runner.temp }}/minapk/package/tools/d8.jar
          APKSIGNER_JAR: ${{ runner.temp }}/minapk/package/tools/apksigner.jar
          ECJ_JAR: ${{ runner.temp }}/minapk/package/tools/ecj-3.45.0.jar
          KOTLINC_HOME: ${{ runner.temp }}/kotlin/package
          PBB_KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          set -e
          if [ -n "${PBB_KEYSTORE_B64:-}" ]; then
            echo "$PBB_KEYSTORE_B64" | base64 -d > release.keystore
            printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "${{ secrets.KEYSTORE_STORE_PASSWORD }}" "${{ secrets.KEYSTORE_ALIAS }}" \
              "${{ secrets.KEYSTORE_KEY_PASSWORD }}" > keystore.properties
          fi
          buildtools/build_apk.sh --debug --out /tmp/PBB-LIVE-TV-debug.apk
          buildtools/build_apk.sh --out /tmp/PBB-LIVE-TV-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: pbb-live-tv-apks
          path: |
            /tmp/PBB-LIVE-TV-debug.apk
            /tmp/PBB-LIVE-TV-release.apk
          if-no-files-found: error
          retention-days: 30

  # Standard toolchain: Android SDK + Gradle (AGP 8.11.0, Kotlin 2.0.21).
  gradle:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Install Android platform 35
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses & install platform
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - name: Assemble (debug + release, debug-signed when no keystore secrets)
        run: |
          set -e
          if [ -n "${{ secrets.KEYSTORE_B64 }}" ]; then
            mkdir -p signkey
            echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > signkey/release.keystore
            printf 'storeFile=signkey/release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "${{ secrets.KEYSTORE_STORE_PASSWORD }}" "${{ secrets.KEYSTORE_ALIAS }}" \
              "${{ secrets.KEYSTORE_KEY_PASSWORD }}" > keystore.properties
          fi
          gradle :app:assembleDebug :app:assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: pbb-live-tv-gradle-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
