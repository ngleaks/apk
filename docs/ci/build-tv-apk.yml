# Copy to .github/workflows/build-tv-apk.yml to build both APKs on every push.
#
# It uses buildtools/install_tools.sh + buildtools/build_apk.sh, i.e. exactly the pipeline that
# produced the APKs in this repo: no Android SDK, no Gradle, no Maven - only pypi + npm.
# (Kept under docs/ here because the automation token that maintains this repo is not allowed to
# create workflow files.)
name: build-tv-apk
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Toolchain
        run: source buildtools/install_tools.sh && env | grep -E '^(JAVA_HOME|ANDROID_JAR|AAPT2|D8_JAR|APKSIGNER_JAR|ECJ_JAR)=' >> "$GITHUB_ENV"
      - name: Logic checks
        run: buildtools/test_core.sh
      - name: Build debug APK
        run: buildtools/build_apk.sh --debug
      - name: Build release APK
        run: buildtools/build_apk.sh
      - name: Verify signatures
        run: |
          apksigner() { "$JAVA_HOME/bin/java" -jar "$APKSIGNER_JAR" "$@"; }
          apksigner verify --print-certs buildtools/dist/pbb-live-tv-2.0.0-release.apk
          apksigner verify --print-certs buildtools/dist/pbb-live-tv-2.0.0-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: pbb-live-tv-apks
          path: buildtools/dist/*.apk
          if-no-files-found: error
