          echo "runner ok"
          java -version 2>&1
          curl -s -o /dev/null -w "google-maven:%{http_code}\n" https://dl.google.com/dl/android/maven2/androidx/media3/media3-exoplayer/1.5.1/media3-exoplayer-1.5.1.pom
